name: ZenzaWatch quality gates

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# No deploy, repository writes, public tokens, or logged-in NicoNico traffic.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-contracts:
    name: NicoNico offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      # comment-history/heatmap.test.mjs imports root test/helpers/extractSource.js,
      # which requires the root @babel/parser dependency. Windows had it installed.
      - name: Install root dependencies for shared test helpers
        run: npm ci --no-audit --no-fund
      - name: Structural and negative-path protocol contract fixtures
        run: node --test test/compat/nico-contract.test.mjs test/compat/nico-failure-modes.test.mjs
      # Public Issue #3: real Chrome hit testing at 240 screen/scale/seek points.
      # Uses only a reduced local page; no login, NicoNico traffic or credentials.
      - name: Verify native fullscreen seek and toolbar controls in Chromium
        run: node test/browser/issue3-public-hit-area.cjs
      - name: Install comment-history TypeScript and Babel tools
        run: npm --prefix packages/comment-history ci --no-audit --no-fund
      - name: Generate local comment-history bundles and run all protocol tests
        run: npm --prefix packages/comment-history test

  legacy-suite:
    name: Existing JavaScript regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install exactly the dependency lockfile
        run: npm ci --no-audit --no-fund
      # Task935: SCUI source parity tests need compiler output in a clean runner.
      # No product source is rewritten; the synchronizer checks tracked JS.
      - name: Install canonical scene TypeScript toolchain
        run: npm --prefix tools/typescript-stage1 ci --no-audit --no-fund
      - name: Emit and verify canonical scene sources
        run: npm --prefix tools/typescript-stage1 run nico:verify
      - name: Full offline regression suite
        run: npm test -- --timeout 20000 --reporter dot
      # Keep real Chromium regressions for newly published UI features.
      - name: Volume tooltip Chromium regression
        run: node test/browser/task939-volume-tooltip.cjs
      - name: Playback-rate tooltip Chromium regression
        run: node test/browser/task947-speed-tooltip.cjs
      - name: Hover tooltip and overlay duration Chromium regression
        run: node test/browser/task970-hover-ui-timing.cjs
      - name: MylistPocket linked-card Chromium regression
        run: node test/browser/task957-pocket-card-legacy-css.cjs
      - name: MylistPocket high-quality thumbnail route regression
        run: node test/browser/task971-pocket-hq-thumbnail.cjs
      - name: Scene preview vertical stability Chromium regression
        run: node test/browser/task954-scene-preview-vertical.cjs
      - name: Fullscreen scene controls clearance Chromium regression
        run: node test/browser/task956-fullscreen-scene-control-clearance.cjs


  typescript:
    name: TypeScript sources, generated files and parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/typescript-stage1/package-lock.json
      - name: Install root dependencies for shared test helpers
        run: npm ci --no-audit --no-fund
      - name: Install TypeScript toolchain
        run: npm --prefix tools/typescript-stage1 ci --no-audit --no-fund
      - name: Type check, generated-source sync and parity tests
        run: npm --prefix tools/typescript-stage1 test
