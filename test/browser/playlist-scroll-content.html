<body style="background:#222;color:#eee;font-family:sans-serif"><h2>Real playlist model, lazy rendering and scroll observer</h2><iframe style="width:300px;height:420px"></iframe><pre id="result"></pre>
<script type="module">
import * as lit from '../../node_modules/lit-html/lit-html.js';
import {classMap} from '../../node_modules/lit-html/directives/class-map.js';
const paths=['packages/lib/src/Emitter.js','packages/lib/src/infra/bounce.js','packages/lib/src/text/textUtil.js','packages/zenza/src/Playlist/VideoListItem.js','packages/zenza/src/Playlist/VideoListModel.js','packages/zenza/src/Playlist/VideoListItemView.js','packages/zenza/src/Playlist/VideoListView.js'];

const view=Object.create(VideoListView.prototype);view._initializeView=()=>{};view.initialize({model,className:'playlist'});

model.setItem(Array.from({length:expectedCount},(_,i)=>new VideoListItem({id:'sm'+(i+1),title:'動画 '+(i+1)+' — スクロール確認',view_counter:31441461,num_res:5594970,mylist_counter:674219,like:45678,length_seconds:219,thumbnail_url:thumb,first_retrieve:'2026/01/01'})));

 const opacity=[];let sample=true;const collect=()=>{if(!sample)return;opacity.push(Number(frame.contentWindow.getComputedStyle(view.listContainer).opacity));requestAnimationFrame(collect);};collect();

 for(let i=15;i>=0;i--){view.listContainer.scrollTop=i*180;await pause(70);}

window.runFastScroll=async(step=350)=>{
 const frames=[];view.listContainer.scrollTop=0;await pause(500);
 for(let i=0;i<50;i++){
  view.listContainer.scrollTop=i*step;
  await new Promise(requestAnimationFrame);

  const cards=[...doc.querySelectorAll('.videoItem')];

 }
 return {frames:frames.length,pass:frames.length===50 && frames.every(x=>x.visible>0 && x.blank===0),blankFrames:frames.filter(x=>x.blank).length,maxBlank:Math.max(...frames.map(x=>x.blank)),examples:frames.filter(x=>x.blank).slice(0,3)};
