<!doctype html><html><head><meta charset="utf-8"><title>Issue 3 reduced reproduction</title>
<!-- Reduced DOM/CSS reproduction, NOT a full ZenzaWatch/live-NicoNico page.
     Relevant rules copied from private 4acebdd3, src/VideoControlBar.js
     and src/constant.js. Unrelated icons/API/worker code is omitted. -->
<style>
html,body { margin:0; width:100%; height:100%; }
:root { --zenza-ui-scale:1; --zenza-control-bar-height:40px; }
.videoControlBar {position:fixed;bottom:0;left:0;width:100vw;height:var(--zenza-control-bar-height,40px);z-index:150000;background:#000;transition:opacity .3s ease,transform .3s ease;user-select:none;contain:layout style size;will-change:transform;}
.videoControlBar * {box-sizing:border-box;user-select:none;line-break:auto;}
.controlItemContainer {position:absolute;top:10px;height:40px;z-index:200;}
.controlItemContainer:hover,.controlItemContainer:focus-within,.videoControlBar.is-menuOpen .controlItemContainer {z-index:260;}
.controlItemContainer.right {right:0;}
.controlItemContainer.right .scalingUI {transform-origin:top right;}
.scalingUI {transform:scale(var(--zenza-ui-scale));}
.controlButton {position:relative;display:inline-block;transition:opacity .4s ease;font-size:20px;width:32px;height:32px;line-height:30px;box-sizing:border-box;text-align:center;cursor:pointer;color:#fff;opacity:.8;min-width:32px;vertical-align:middle;outline:none;}
.controlButton:hover {cursor:pointer;opacity:1;}
.videoControlBar:hover .controlButton {opacity:1;pointer-events:auto;}
.videoControlBar .controlButton:focus-within {pointer-events:none;}
.videoControlBar .controlButton:focus-within .zenzaPopupMenu,.videoControlBar .controlButton .zenzaPopupMenu:hover {pointer-events:auto;visibility:visible;opacity:.99;transition:opacity .3s;}
.videoControlBar .controlButton:focus-within .tooltip {display:none;}
.controlButton .tooltip {display:none;pointer-events:none;position:absolute;left:16px;top:-30px;transform:translate(-50%,0);font-size:12px;line-height:16px;padding:2px 4px;z-index:100;}
.is-mouseMoving .controlButton:hover .tooltip {display:block;opacity:1;}
.videoControlBar .zenzaSubMenu {left:50%;transform:translate(-50%,0);bottom:44px;white-space:nowrap;}
.videoControlBar .zenzaSubMenu::after {content:'';position:absolute;display:block;width:110%;height:16px;left:-5%;}
.zenzaPopupMenu {display:block;position:absolute;background:#333;color:#fff;overflow:visible;border:1px solid #ccc;padding:0;opacity:.99;box-sizing:border-box;transition:opacity .3s ease;z-index:50000;user-select:none;}
.zenzaPopupMenu:not(.show) {transition:none;visibility:hidden;opacity:0;pointer-events:none;}
.zenzaPopupMenu ul {padding:0;}
.zenzaPopupMenu ul>li {position:relative;margin:2px 4px;white-space:nowrap;cursor:pointer;padding:2px 8px;list-style-type:none;}
.zenzaPopupMenu li>span {box-sizing:border-box;margin-left:8px;display:inline-block;cursor:pointer;}
.seekBarContainer {position:absolute;top:0;left:0;width:100%;cursor:pointer;z-index:250;}
.seekBarContainer .seekBarShadow {position:absolute;background:transparent;opacity:0;width:100vw;height:8px;top:-8px;}
.is-mouseMoving .seekBarContainer:hover .seekBarShadow {height:48px;top:-48px;}
.is-abort .seekBarContainer,.is-loading .seekBarContainer,.is-error .seekBarContainer {pointer-events:none;}
.is-abort .seekBarContainer *,.is-error .seekBarContainer * {display:none;}
.seekBar {position:relative;width:100%;height:10px;margin:2px 0 2px;border-top:1px solid #333;border-bottom:1px solid #333;cursor:pointer;transition:height .2s ease 1s,margin-top .2s ease 1s;}
.seekBar:hover {height:24px;margin-top:-14px;transition:none;background-color:rgba(0,0,0,.5);}
.seekBarContainer .seekBar * {pointer-events:none;}
.seekBarContainer .seekBar .seekRange {-webkit-appearance:none;position:absolute;width:100vw;height:100%;cursor:pointer;opacity:0;pointer-events:auto;}
.seekRange::-webkit-slider-thumb {-webkit-appearance:none;height:10px;width:2px;}
.seekBarToolTip {position:absolute;display:inline-block;visibility:hidden;bottom:24px;left:0;width:180px;z-index:150;opacity:0;pointer-events:none;}
.is-dragging .seekBarToolTip,.seekBarContainer:hover .seekBarToolTip {opacity:1;visibility:visible;}
.seekBarToolTipInner {pointer-events:auto;}
.is-dragging .seekBarToolTipInner {pointer-events:none;}
.videoControlBar .commentHistorySwitch:focus-within {pointer-events:auto;}
.commentHistorySwitch {border:0;padding:0;background:transparent;}
.videoServerTypeMenu {min-width:40px;}
</style>
<style id="full" class="screenMode for-screen-full videoControlBar">
.screenModeSelectMenu {display:none;}
.controlItemContainer.left {top:auto;transform-origin:top left;}
.seekBarContainer {top:auto;bottom:0;z-index:300;}
.seekBarContainer:hover .seekBarShadow {height:14px;top:-12px;}
.seekBar {margin-top:0px;margin-bottom:-14px;height:24px;transition:none;}
.screenModeMenu {display:none;}
.controlItemContainer.center {top:auto;}
.zenzaStoryboardOpen .controlItemContainer.center {background:transparent;}
.zenzaStoryboardOpen .controlItemContainer.center .scalingUI {background:rgba(32,32,32,.5);}
.zenzaStoryboardOpen .controlItemContainer.center .scalingUI:hover {background:rgba(32,32,32,.8);}
.controlItemContainer.right {top:auto;z-index:310;}
.videoControlBar.is-menuOpen .controlItemContainer.right {z-index:320;}
</style></head><body class="is-fullscreen is-mouseMoving"><div id="zenzaVideoPlayerDialog"><div class="zenzaPlayerContainer"><div class="videoControlBar" data-command="nop">
<div class="seekBarContainer"><div class="seekBarShadow"></div><div class="seekBar"><div class="seekBarPointer"></div><div class="bufferRange"></div><div class="progressWave"></div><input type="range" class="seekRange" min="0" max="600" step="any" value="60"><canvas width="200" height="10" class="heatMap zenzaHeatMap"></canvas></div><div class="seekBarToolTip"><div class="seekBarToolTipInner">Preview</div></div></div>
<div class="controlItemContainer right"><div class="scalingUI">
<button type="button" class="commentHistorySwitch controlButton" data-command="toggle-commentHistoryPanel"><span class="controlButtonInner">H</span><span class="tooltip">history</span></button>
<div class="screenFilterSwitch controlButton" data-command="toggle-screenFilterPanel"><div class="controlButtonInner">B</div><div class="tooltip">filter</div></div>
<div class="videoServerTypeMenu controlButton" tabindex="-1" data-has-submenu="1"><div class="controlButtonInner">Q</div><div class="tooltip">quality</div><div class="videoServerTypeSelectMenu zenzaPopupMenu zenzaSubMenu"><ul><li data-command="quality" data-param="720"><span>720p</span></li><li data-command="quality" data-param="360"><span>360p</span></li></ul></div></div>
<div class="screenModeMenu controlButton" tabindex="-1"><div class="controlButtonInner">W</div></div>
<div class="fullscreenControlBarModeMenu controlButton" tabindex="-1" data-has-submenu="1"><div class="controlButtonInner">P</div><div class="zenzaPopupMenu zenzaSubMenu"><ul><li data-command="mode"><span>Mode</span></li></ul></div></div>
<div class="fullscreenSwitch controlButton" data-command="fullscreen"><div class="controlButtonInner">F</div><div class="tooltip">fullscreen</div></div>
<div class="settingPanelSwitch controlButton" data-command="settingPanel"><div class="controlButtonInner">S</div><div class="tooltip">settings</div></div>
</div></div></div></div></div>
<script>
window.evidence={inputs:[],moves:[],commands:[]};
const range=document.querySelector('.seekRange');
range.addEventListener('input',e=>{evidence.inputs.push(Number(e.target.value));});
document.querySelector('.seekBar').addEventListener('mousemove',e=>evidence.moves.push(e.offsetX));
document.querySelector('.seekBar').addEventListener('mousedown',()=>document.querySelector('div.videoControlBar').classList.add('is-dragging'));
document.addEventListener('mouseup',()=>document.querySelector('div.videoControlBar').classList.remove('is-dragging'));
document.querySelector('div.videoControlBar').addEventListener('click',e=>{const el=e.target.closest('[data-command]');if(el)evidence.commands.push(el.dataset.command);const menu=e.target.closest('[data-has-submenu]');if(menu)menu.focus();});
</script></body></html>
